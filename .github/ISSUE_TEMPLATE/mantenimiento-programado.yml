name: "Mantenimiento programado"
description: "PM planificado"
title: "[PM] "
labels: ["estado:pm"]
body:
  - type: dropdown
    id: unidad
    attributes:
      label: Unidad
      options: [FM-01, FM-02, FM-03, FM-04, SR-01, SR-02, SR-03, SR-04]
    validations: {required: true}
  - type: input
    id: tipo_pm
    attributes:
      label: Tipo de PM
    validations: {required: true}
  - type: input
    id: fecha_ingreso
    attributes:
      label: Fecha de ingreso
    validations: {required: true}
